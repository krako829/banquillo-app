name: core

on:
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
