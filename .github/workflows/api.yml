name: api

on:
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  imagen:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t banquillo-api ./api
