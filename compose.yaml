services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banquillo
      POSTGRES_USER: banquillo
      POSTGRES_PASSWORD: banquillo
    ports:
      - "5432:5432"
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banquillo -d banquillo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    profiles: ["completo"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/banquillo
      DB_USER: banquillo
      DB_PASSWORD: banquillo
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos-db:
