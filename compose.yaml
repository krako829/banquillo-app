services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banquillo
      POSTGRES_USER: banquillo
      POSTGRES_PASSWORD: banquillo
    ports:
      - "5432:5432"
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banquillo -d banquillo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos-db:
