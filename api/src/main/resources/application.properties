spring.application.name=banquillo-api

# Base de datos (los valores por defecto sirven para el compose.yaml local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banquillo}
spring.datasource.username=${DB_USER:banquillo}
spring.datasource.password=${DB_PASSWORD:banquillo}

# Las tablas las crea Flyway; Hibernate solo comprueba que coinciden
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fechas como 2026-11-03 en las URLs
spring.mvc.format.date=iso

# Errores en formato estándar (RFC 9457)
spring.mvc.problemdetails.enabled=true

# Solo exponemos el estado de salud
management.endpoints.web.exposure.include=health

